
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Templar: Battle for Jerusalem</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            text-align: center;
        }
        header {
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .score-board {
            background: #1e1e1e;
            border: 2px solid #d4af37;
            border-radius: 16px;
            padding: 15px;
            margin: 10px 0;
        }
        .score-title {
            font-size: 16px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
        .clicker-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .click-btn {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #3a3a3a 0%, #1a1a1a 100%);
            border: 4px solid #d4af37;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .click-btn:active {
            transform: scale(0.93);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .click-btn img, .click-icon {
            font-size: 70px;
        }
        .energy-bar-container {
            width: 100%;
            background: #2a2a2a;
            border-radius: 10px;
            height: 16px;
            margin: 15px 0;
            overflow: hidden;
            border: 1px solid #444;
        }
        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #ffd700);
            width: 100%;
            transition: width 0.2s linear;
        }
        .energy-text {
            font-size: 14px;
            color: #ccc;
            margin-top: 5px;
        }
        .upgrades-section {
            background: #1a1a1a;
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #333;
            margin-bottom: 15px;
        }
        .upgrade-btn {
            background: #252525;
            border: 1px solid #d4af37;
            color: #fff;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .upgrade-btn:active {
            background: #333;
        }
        .upgrade-btn:disabled {
            border-color: #555;
            color: #777;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>⚔️ Templar: Иерусалим</header>

        <div class="score-board">
            <div class="score-title">Золото крестоносца</div>
            <div class="score-value" id="gold">0</div>
        </div>

        <div class="clicker-area">
            <div class="click-btn" id="clickBtn">
                <span class="click-icon">🛡️</span>
            </div>
        </div>

        <div>
            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
            <div class="energy-text"><span id="energy">1000</span> / <span id="maxEnergy">1000</span> Энергия</div>
        </div>

        <div class="upgrades-section">
            <button class="upgrade-btn" id="upgradeBtn" onclick="buyUpgrade()">
                <span>🗡️ Меч тамплиера (+1 за клик)</span>
                <span id="upgradeCost">50 🥇</span>
            </button>
        </div>
    </div>

    <script>
        let gold = parseInt(localStorage.getItem('templar_gold')) || 0;
        let clickPower = parseInt(localStorage.getItem('templar_power')) || 1;
        let energy = parseInt(localStorage.getItem('templar_energy')) || 1000;
        let maxEnergy = 1000;
        let upgradeCost = parseInt(localStorage.getItem('templar_cost')) || 50;

        const goldEl = document.getElementById('gold');
        const energyEl = document.getElementById('energy');
        const maxEnergyEl = document.getElementById('maxEnergy');
        const energyBar = document.getElementById('energyBar');
        const clickBtn = document.getElementById('clickBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const upgradeCostEl = document.getElementById('upgradeCost');

        function updateUI() {
            goldEl.innerText = gold;
            energyEl.innerText = Math.floor(energy);
            maxEnergyEl.innerText = maxEnergy;
            energyBar.style.width = (energy / maxEnergy) * 100 + '%';
            upgradeCostEl.innerText = upgradeCost + ' 🥇';
            
            if (gold < upgradeCost) {
                upgradeBtn.setAttribute('disabled', 'true');
            } else {
                upgradeBtn.removeAttribute('disabled');
            }
        }

        clickBtn.addEventListener('click', (e) => {
            if (energy >= clickPower) {
                gold += clickPower;
                energy -= clickPower;
                saveGame();
                updateUI();
            }
        });

        function buyUpgrade() {
            if (gold >= upgradeCost) {
                gold -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.7);
                saveGame();
                updateUI();
            }
        }

        // Восстановление энергии каждую секунду
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 15);
                updateUI();
            }
        }, 1000);

        function saveGame() {
            localStorage.setItem('templar_gold', gold);
            localStorage.setItem('templar_power', clickPower);
            localStorage.setItem('templar_energy', energy);
            localStorage.setItem('templar_cost', upgradeCost);
        }

        updateUI();
    </script>
</body>
  </html>
